<index.html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Listing</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel for JSX -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS (xlsx) for Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        /* Using Inter font for a modern look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* A slightly off-white background */
        }
        /* Custom styles for a better look and feel */
        .card {
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: box-shadow 0.3s ease-in-out;
        }
        .card:hover {
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        .btn {
            transition: background-color 0.3s, transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .form-input {
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            padding: 0.75rem 1rem;
            width: 100%;
        }
        .form-input:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px #bfdbfe;
        }
        /* Animation for fade-in effect */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // SVG Icons
        const DownloadIcon = ({ size = 18 }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>);
        const BedIcon = ({ size = 20 }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 4v16h20V4H2z"/><path d="M2 10h20"/><path d="M12 4v6"/></svg>);
        const BathIcon = ({ size = 20 }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l2 2 2-2"/><path d="M12 11V8"/><path d="M12 22a7 7 0 0 0 7-7c0-4-7-9-7-9s-7 5-7 9a7 7 0 0 0 7 7z"/></svg>);
        const PetIcon = ({ size = 20 }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5c.67 0 1.35.09 2 .26 1.78.47 3.22 1.91 3.69 3.69.17.65.26 1.33.26 2.05 0 2.22-1.78 4-4 4s-4-1.78-4-4c0-.72.09-1.4.26-2.05.47-1.78 1.91-3.22 3.69-3.69C10.65 5.09 11.33 5 12 5z"/><path d="M8 14s-1 2-3 2-2-1-2-3 1-4 3-4 3 2 3 2"/><path d="M16 14s1 2 3 2 2-1 2-3-1-4-3-4-3 2-3 2"/></svg>);
        const TrashIcon = ({ size = 16 }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>);

        function App() {
            // Initial form state with new fields
            const initialFormState = {
                title: "", location: "", description: "",
                images: [], contact: "", bedrooms: "",
                bathrooms: "", petFriendly: false
            };

            // State for properties, form, and errors
            const [properties, setProperties] = useState([]);
            const [form, setForm] = useState(initialFormState);
            const [error, setError] = useState("");

            // Handles changes in text inputs and checkboxes
            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setForm({ ...form, [name]: type === 'checkbox' ? checked : value });
            };

            // Handles image file selection
            const handleImageChange = (e) => {
                const files = Array.from(e.target.files);
                if (form.images.length + files.length > 15) {
                    setError("You can upload a maximum of 15 images.");
                    return;
                }
                setError("");

                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setForm(prevForm => ({
                            ...prevForm,
                            images: [...prevForm.images, reader.result]
                        }));
                    };
                    reader.readAsDataURL(file);
                });
            };
            
            // Removes an image from the preview
            const handleRemoveImage = (indexToRemove) => {
                setForm(prevForm => ({
                    ...prevForm,
                    images: prevForm.images.filter((_, index) => index !== indexToRemove)
                }));
            };

            // Adds a new property to the list
            const handleAdd = () => {
                // Validation for all required fields
                if (!form.title.trim() || !form.location.trim() || !form.description.trim() || !form.contact.trim() || !form.bedrooms || !form.bathrooms) {
                    setError("Please fill out all fields, including bedrooms and bathrooms.");
                    return;
                }
                
                setProperties([...properties, { ...form, id: Date.now() }]);
                setForm(initialFormState); // Reset form to initial state
                setError("");
            };

            // Downloads property data as an Excel file, excluding images
            const downloadExcel = () => {
                const propertiesForExport = properties.map(p => {
                    const { images, id, ...rest } = p; // Exclude images and internal ID
                    return {
                        ...rest,
                        petFriendly: p.petFriendly ? 'Yes' : 'No'
                    };
                });
                const worksheet = XLSX.utils.json_to_sheet(propertiesForExport);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Properties");
                XLSX.writeFile(workbook, "real_estate_list.xlsx");
            };

            return (
                <div className="min-h-screen p-4 sm:p-8">
                    <div className="max-w-4xl mx-auto">
                        <h1 className="text-3xl sm:text-4xl font-bold mb-8 text-center text-gray-800">
                            Real Estate Listing
                        </h1>

                        {/* Input form card */}
                        <div className="card mb-8 p-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input name="title" placeholder="Property Title" value={form.title} onChange={handleChange} className="form-input md:col-span-2" />
                                <input name="location" placeholder="Location" value={form.location} onChange={handleChange} className="form-input md:col-span-2" />
                                <input name="contact" placeholder="Contact Info (Phone or Email)" value={form.contact} onChange={handleChange} className="form-input md:col-span-2" />
                                <input name="bedrooms" type="number" placeholder="Bedrooms" value={form.bedrooms} onChange={handleChange} className="form-input" min="0" />
                                <input name="bathrooms" type="number" placeholder="Bathrooms" value={form.bathrooms} onChange={handleChange} className="form-input" min="0" />
                                <textarea name="description" placeholder="Description" value={form.description} onChange={handleChange} className="form-input md:col-span-2" rows="4" />
                                
                                {/* Image Uploader */}
                                <div className="md:col-span-2">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Property Images (up to 15)</label>
                                    <input type="file" multiple accept="image/*" onChange={handleImageChange} className="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
                                </div>

                                {/* Image Previews */}
                                {form.images.length > 0 && (
                                    <div className="md:col-span-2 grid grid-cols-3 sm:grid-cols-5 gap-4">
                                        {form.images.map((image, index) => (
                                            <div key={index} className="relative">
                                                <img src={image} alt={`preview ${index}`} className="w-full h-24 object-cover rounded-md" />
                                                <button onClick={() => handleRemoveImage(index)} className="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 leading-none">
                                                    <TrashIcon size={12}/>
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                <div className="flex items-center gap-2 md:col-span-2">
                                    <input type="checkbox" id="petFriendly" name="petFriendly" checked={form.petFriendly} onChange={handleChange} className="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"/>
                                    <label htmlFor="petFriendly" className="text-sm text-gray-700">Pet Friendly</label>
                                </div>

                                {error && <p className="text-red-500 text-sm md:col-span-2">{error}</p>}
                                <button onClick={handleAdd} className="btn w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg md:col-span-2">
                                    Post Property
                                </button>
                            </div>
                        </div>

                        {/* Display list of properties */}
                        <div className="space-y-6">
                            {properties.map((item) => (
                                <div key={item.id} className="card p-4 sm:p-6 animate-fade-in">
                                    {item.images.length > 0 && (
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 mb-4">
                                            {item.images.map((image, index) => (
                                                <img key={index} src={image} alt={`${item.title} ${index + 1}`} className="w-full h-32 object-cover rounded-md" />
                                            ))}
                                        </div>
                                    )}
                                    <h2 className="text-2xl font-bold text-gray-900">{item.title}</h2>
                                    <p className="text-gray-600 mb-2">{item.location}</p>
                                    <div className="flex flex-wrap items-center gap-x-4 gap-y-2 text-gray-700 mb-4">
                                        <span className="flex items-center gap-2"><BedIcon/> {item.bedrooms} Beds</span>
                                        <span className="flex items-center gap-2"><BathIcon/> {item.bathrooms} Baths</span>
                                        {item.petFriendly && <span className="flex items-center gap-2 text-green-600 font-semibold"><PetIcon/> Pet Friendly</span>}
                                    </div>
                                    <p className="text-sm text-gray-700 mb-3">{item.description}</p>
                                    <p className="text-sm font-semibold text-gray-800">Contact: {item.contact}</p>
                                </div>
                            ))}
                        </div>

                        {/* Download button */}
                        {properties.length > 0 && (
                            <div className="text-center mt-10">
                                <button onClick={downloadExcel} className="btn inline-flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg">
                                    <DownloadIcon size={18} />
                                    Download as Excel
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
